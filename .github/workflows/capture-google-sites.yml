name: Capture public Google Sites reference layout
on:
  push:
    paths:
      - ".github/workflows/capture-google-sites.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture original site screenshots
        run: python scripts/capture_google_sites.py
      - name: Check in visual references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-original/reference-screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Record original Google Sites visual references for migration"
            git pull --rebase origin main
            git push origin main
          fi
