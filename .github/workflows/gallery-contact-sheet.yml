name: Check source gallery image captions
on:
  push:
    paths:
      - ".github/workflows/gallery-contact-sheet.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build photo contact sheet
        run: python scripts/make_gallery_contact_sheet.py
      - name: Store source photo contact sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-check/gallery-contact-sheet.*
          if ! git diff --cached --quiet; then
            git commit -m "Add contact sheet for original gallery photo-caption verification"
            git pull --rebase origin main
            git push origin main
          fi

# Updated visual sheet includes newly recovered CSS-background photographs.
