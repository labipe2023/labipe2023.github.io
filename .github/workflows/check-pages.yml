name: Verify live migrated GitHub Pages site
on:
  push:
    paths:
      - ".github/workflows/check-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deployment
        run: sleep 35
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed Pages and capture previews
        run: python scripts/verify_deployed_site.py
      - name: Store visual QA results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-check
          if ! git diff --cached --quiet; then
            git commit -m "Record migrated site browser verification"
            git pull --rebase origin main
            git push origin main
          fi

# Final visual and carousel verification after source gallery import.
