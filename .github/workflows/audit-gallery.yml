name: Audit hidden gallery photos from original Google Sites
on:
  push:
    paths:
      - ".github/workflows/audit-gallery.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image downloader
        run: |
          python -m pip install --quiet requests playwright
          python -m playwright install --with-deps chromium
      - name: Inspect gallery images including backgrounds
        run: python scripts/audit_gallery_images.py
      - name: Save source media audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-original
          if ! git diff --cached --quiet; then
            git commit -m "Capture additional original gallery image sources"
            git pull --rebase origin main
            git push origin main
          fi
