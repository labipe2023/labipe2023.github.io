name: Import public Google Sites content and photos
on:
  push:
    paths:
      - ".github/workflows/import-google-sites.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch original public Google Sites pages and images
        run: python scripts/import_google_sites.py
      - name: Commit content snapshot and copied photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-original
          if ! git diff --cached --quiet; then
            git commit -m "Import original Google Sites public content and images"
            git push
          fi
